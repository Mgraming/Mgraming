<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>باسبور العربية</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="باسبور العربية: سجل صيانة عربيتك، تذكيرات، ورش قريبة منك، وتقرير تاريخ العربية لما تيجي تبيعها.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home"><img src="icon.svg" alt="" width="30" height="30"><span>باسبور</span></a>
    <div class="top-actions">
      <select id="car-switch" aria-label="اختار العربية"></select>
      <a href="#more" class="top-more" aria-label="المزيد" data-icon="menu"></a>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="home"><span data-icon="house"></span>الرئيسية</button>
    <button data-tab="log"><span data-icon="scroll-text"></span>السجل</button>
    <button data-tab="add" class="add"><span data-icon="plus"></span>سجّل</button>
    <button data-tab="workshops"><span data-icon="wrench"></span>ورش وقطع</button>
    <button data-tab="passport"><span data-icon="book-marked"></span>الباسبور</button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
